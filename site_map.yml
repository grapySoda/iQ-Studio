    title: "Perception Model Benchmark"
    description: "Computer vision perception model performance suite."
    current: benchmarks/perception-model
    category: Benchmarks
    category_url: ../benchmarks/index.html

  # ---------- Reference ----------
  - output: reference/launcher.html
    source: docs/how-to-use-iqs-launcher.md
    fig_dir: docs/fig
    title: "iqs-launcher Reference"
    description: "How iqs-launcher works: online vs. offline modes, pre-staging packages for air-gapped platforms."
    current: reference/launcher
    category: Reference
    category_url: ../index.html

  - output: reference/changelog.html
    source: docs/changelog.md
    fig_dir: docs/fig
    title: "Changelog"
    description: "iQ-Studio version history."
    current: reference/changelog
    category: Reference
    category_url: ../index.html

