    description: "Multi-stream YOLO inference benchmark under InnoPPE workloads."
    current: benchmarks/innoppe
    category: Benchmarks
    category_url: ../benchmarks/index.html

  - output: benchmarks/streampipe.html
    source: benchmarks/iqs-streampipe/README.md
    fig_dir: benchmarks/iqs-streampipe/fig
    title: "iQS-Streampipe Benchmark"
    description: "Multi-stream generic inference pipeline scaling."
