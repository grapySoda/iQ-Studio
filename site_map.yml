# site_map.yml — drives tools/build_site.py
#
# Each entry generates one site/<output>.html from <source> README via build_site.py.
# Landing pages (entries with no `source`) are hand-authored under site/<output> and
# only appear here to provide breadcrumb/pager context for adjacent tutorial pages.
#
# Linear `order` is the prev/next reading sequence. Categories give human group
# names for breadcrumbs. `current` matches the data-page used by the sidebar HTML
# so the active link gets highlighted.

pages:

  # ---------- Starting Guides ----------
  - output: starting-guides/q911.html
    source: tutorials/starting-guides/q911/README.md
    fig_dir: tutorials/starting-guides/q911/fig
    title: "Q911 Quick Start Guide"
    description: "Power on the EXMP-Q911 for the first time — debug port, cabling, ADB / SSH, and a first boot."
    current: starting-guides/q911
    category: Starting Guides
    category_url: ../starting-guides/index.html

  - output: starting-guides/flash-image.html
    source: tutorials/starting-guides/flash-image/README.md
    fig_dir: tutorials/starting-guides/flash-image/fig
    title: "Q911 Image Flashing Guide"
    description: "Re-flash the system image on the EXMP-Q911."
    current: starting-guides/flash-image
    category: Starting Guides
    category_url: ../starting-guides/index.html

  - output: starting-guides/ota.html
    source: tutorials/starting-guides/ota/README.md
    fig_dir: tutorials/starting-guides/ota/fig
    title: "Qualcomm OTA Guide"
    description: "Update firmware or the OS image on an already-deployed device over the air."
    current: starting-guides/ota
    category: Starting Guides
    category_url: ../starting-guides/index.html

  # ---------- Applications ----------
  - output: applications/iqs-vlm.html
    source: tutorials/applications/iqs-vlm/README.md
    fig_dir: tutorials/applications/iqs-vlm/fig
    title: "iQS-VLM"
    description: "Live vision-language model demo on a UVC camera feed."
    current: applications/iqs-vlm
    category: Applications
    category_url: ../applications/index.html

  - output: applications/iqs-streampipe.html
    source: tutorials/applications/iqs-streampipe/README.md
    fig_dir: tutorials/applications/iqs-streampipe/fig
    title: "iQS-Streampipe"
    description: "Multi-stream inference pipeline demo."
    current: applications/iqs-streampipe
    category: Applications
    category_url: ../applications/index.html

  - output: applications/iqs-yolov10n.html
    source: tutorials/applications/iqs-yolov10n/README.md
    fig_dir: tutorials/applications/iqs-yolov10n/fig
    title: "iQS-YOLOv10n INT8 Inference"
    description: "YOLOv10n INT8 inference on GPU and NPU."
    current: applications/iqs-yolov10n
    category: Applications
    category_url: ../applications/index.html

  # ---------- AVL ----------
  - output: avl/gmsl-camera.html
    source: tutorials/avl/gmsl-camera/README.md
    fig_dir: tutorials/avl/gmsl-camera/fig
    title: "GMSL Cameras"
    description: "Multi-channel GMSL2 camera bring-up, including the 8-channel octuple demo."
    current: avl/gmsl-camera
    category: Approved Vendor List
    category_url: ../avl/index.html

  - output: avl/mipi-camera.html
    source: tutorials/avl/mipi-camera/README.md
    fig_dir: tutorials/avl/mipi-camera/fig
    title: "MIPI CSI-2 Cameras"
    description: "MIPI CSI-2 camera integration on EXMP-Q911 and the iQ-9075 EVK."
    current: avl/mipi-camera
    category: Approved Vendor List
    category_url: ../avl/index.html

  # ---------- Model Deploy ----------
  - output: model-deploy/yolo26.html
    source: tutorials/model-deploy/cv/yolo26/README.md
    fig_dir: tutorials/model-deploy/cv/yolo26/fig
    title: "Model Deploy: YOLO26"
    description: "Convert, optimize, and run YOLO26 models on the target platform."
    current: model-deploy/yolo26
    category: Model Deploy
    category_url: ../model-deploy/index.html

  # ---------- SDKs ----------
  - output: sdks/iqs-vlm.html
    source: tutorials/sdks/iqs-vlm/README.md
    fig_dir: tutorials/sdks/iqs-vlm/fig
    title: "iQS-VLM SDK"
    description: "Interact with the OGenie server through Open WebUI."
    current: sdks/iqs-vlm
    category: SDKs
    category_url: ../sdks/index.html

  - output: sdks/iqs-streampipe.html
    source: tutorials/sdks/iqs-streampipe/README.md
    fig_dir: tutorials/sdks/iqs-streampipe/fig
    title: "iQS-Streampipe SDK"
    description: "Change the model and the video source feeding the Streampipe pipeline."
    current: sdks/iqs-streampipe
    category: SDKs
    category_url: ../sdks/index.html

  - output: sdks/iqs-ogenie.html
    source: tutorials/sdks/iqs-ogenie/README.md
    fig_dir: tutorials/sdks/iqs-ogenie/fig
    title: "iQS-OGenie SDK"
